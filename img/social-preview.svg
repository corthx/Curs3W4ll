<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Source for social-preview.png (rsvg-convert img/social-preview.svg -o img/social-preview.png) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226" />
      <stop offset="1" stop-color="#1b1035" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#97DDB8" />
      <stop offset="0.5" stop-color="#E061B4" />
      <stop offset="1" stop-color="#526CDD" />
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#97DDB8" />
      <stop offset="0.55" stop-color="#E061B4" />
      <stop offset="1" stop-color="#7B8CFF" />
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E061B4" stop-opacity="0.45" />
      <stop offset="1" stop-color="#E061B4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#526CDD" stop-opacity="0.5" />
      <stop offset="1" stop-color="#526CDD" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <ellipse cx="1000" cy="120" rx="420" ry="300" fill="url(#glowPink)" />
  <ellipse cx="1120" cy="600" rx="460" ry="300" fill="url(#glowBlue)" />

  <!-- Keep content inside GitHub's recommended 40px safe border -->
  <text x="120" y="220" class="mono" font-size="30" fill="#97DDB8">~/corthx $ whoami</text>
  <text x="120" y="330" class="font" font-size="96" font-weight="800" fill="url(#name)">Corentin Hervaud</text>
  <text x="120" y="400" class="font" font-size="38" fill="#c9cde8">Software Engineer · DevOps · GitLab</text>
  <text x="120" y="452" class="font" font-size="38" fill="#c9cde8">Self-hosting · 3D printing</text>
  <text x="120" y="540" class="mono" font-size="28" fill="#8a8fb8">github.com/corthx</text>

  <rect y="628" width="1280" height="12" fill="url(#accent)" />
</svg>
