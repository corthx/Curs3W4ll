<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Corentin Hervaud</title>
  <desc id="desc">Software Engineer in Bordeaux, France. DevOps, GitLab, self-hosting and 3D printing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226" />
      <stop offset="1" stop-color="#1b1035" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="2000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#97DDB8" />
      <stop offset="0.25" stop-color="#E061B4" />
      <stop offset="0.5" stop-color="#526CDD" />
      <stop offset="0.75" stop-color="#E061B4" />
      <stop offset="1" stop-color="#97DDB8" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="name" x1="210" y1="0" x2="630" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#97DDB8" />
      <stop offset="0.5" stop-color="#E061B4" />
      <stop offset="1" stop-color="#7B8CFF" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -210 0; 0 0" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E061B4" stop-opacity="0.45" />
      <stop offset="1" stop-color="#E061B4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#526CDD" stop-opacity="0.5" />
      <stop offset="1" stop-color="#526CDD" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05" />
    </pattern>

    <clipPath id="card">
      <rect width="1000" height="220" rx="18" />
    </clipPath>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .glow-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .glow-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .wave { animation: wave 2.4s ease-in-out infinite; transform-origin: 70% 70%; transform-box: fill-box; }

    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-140px, -20px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-a, .glow-b, .cursor, .wave { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="220" fill="url(#bg)" />
    <rect width="1000" height="220" fill="url(#grid)" />
    <ellipse class="glow-a" cx="760" cy="40" rx="260" ry="160" fill="url(#glowPink)" />
    <ellipse class="glow-b" cx="880" cy="200" rx="280" ry="160" fill="url(#glowBlue)" />
    <rect y="214" width="1000" height="6" fill="url(#accent)" />
  </g>
  <rect x="0.5" y="0.5" width="999" height="219" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <text x="56" y="70" class="mono" font-size="18" fill="#97DDB8">~/corthx $ whoami</text>

  <text x="56" y="128" class="font" font-size="48" font-weight="700" fill="#ffffff">
    Hi, I'm <tspan fill="url(#name)">Corentin</tspan>
  </text>
  <text x="428" y="124" class="wave" font-size="40">👋</text>

  <text x="56" y="168" class="font" font-size="20" fill="#c9cde8">
    Software Engineer · DevOps · GitLab · Self-hosting · 3D printing
  </text>

  <text x="56" y="196" class="mono" font-size="15" fill="#8a8fb8">📍 Bordeaux, France<tspan class="cursor" fill="#E061B4"> ▍</tspan></text>
</svg>
